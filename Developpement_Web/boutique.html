<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Parcourez la collection WARA : vêtements éco-conçus 100% biodégradables. Fabriqués localement à partir de fibres de sargasses.">
    <meta property="og:title" content="Boutique WARA | Mode régénérative tropicale">

    <title>Boutique | WARA Mode Circulaire</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,700;1,400&family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <a href="#main-content" class="sr-only">Passer au contenu principal</a>
    <header>
        <nav class="navbar" role="navigation" aria-label="Navigation principale">
            <div class="logo"><a href="index.html">WARA</a></div>
            <ul class="nav-links">
                <li><a href="concept.html" data-i18n="nav_concept">Le Concept</a></li>
                <li><a href="boutique.html" class="active" data-i18n="nav_shop">Boutique</a></li>
                <li><a href="panier.html" data-i18n="nav_cart">Panier</a></li>
                <li class="lang-switcher">
                    <button class="lang-switch" data-lang="fr">FR</button>
                    <button class="lang-switch" data-lang="en">EN</button>
                </li>
            </ul>
            <button class="burger-menu" aria-label="Ouvrir le menu de navigation" aria-expanded="false">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </nav>
    </header>

    <main id="main-content" class="container shop-layout">
        <aside class="filters">
            <h3 data-i18n="shop_filters">Filtres</h3>
            <div class="filter-group">
                <h4 data-i18n="shop_categories">Catégories</h4>
                <label><input type="checkbox"> <span data-i18n="cat_tops">Hauts</span></label>
                <label><input type="checkbox"> <span data-i18n="cat_bottoms">Bas</span></label>
                <label><input type="checkbox"> <span data-i18n="cat_acc">Accessoires</span></label>
            </div>
            <div class="filter-group">
                <h4 data-i18n="shop_materials">Matières</h4>
                <label><input type="checkbox"> <span data-i18n="mat_sargassum">Sargasses</span></label>
                <label><input type="checkbox"> <span data-i18n="mat_linen">Lin bio</span></label>
                <label><input type="checkbox"> <span data-i18n="mat_pineapple">Fibre d'ananas</span></label>
            </div>
        </aside>

        <section class="products-grid">
            <!-- Les produits seront chargés ici via JavaScript depuis Strapi -->
            <p data-i18n="featured_loading">Chargement des produits...</p>
        </section>
    </main>

    <footer>
        <p data-i18n="footer_rights">&copy; 2026 WARA - Projet SAE 2.02 BUT MMI. Tous droits réservés.</p>
        <p data-i18n="footer_cert">Certifié GOTS &amp; OEKO-TEX | Made in Guadeloupe</p>
        <nav class="footer-links" aria-label="Liens légaux">

        </nav>
    </footer>

    <!-- Scripts pour Strapi -->
    <script src="js/translations.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/config.js"></script>
    <script src="js/components.js"></script>
    <script src="js/app.js"></script>
    <script src="js/api.js"></script>
    <script src="js/shop.js"></script>
